<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="card">
      <h2 class="card__title">🌗 Modern Dark/Light Theme</h2>
      <p>Switch between light and dark theme easily using CSS variables!</p>
      <button class="card__button" id="theme-toggle">Toggle Theme</button>
    </div>

    <!-- Javascript Code -->
    <script>
      const toggleBtn = document.querySelector("#theme-toggle");
      toggleBtn.onclick = () => {
        document.body.classList.toggle("dark");
      };
    </script>
  </body>
</html>
